[build-system]
requires = ["setuptools", "setuptools_scm", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# Non-code configuration stays here
version_file = "koan/_version.py"
version_file_template = """# Auto-generated by setuptools_scm — do not edit
__version__ = "{version}"
__gitstamp__ = "{scm_version.node}"
__gitdate__ = "{scm_version.node_date}"
__builddate__ = "{scm_version.time}"
"""

[tool.isort]
profile = "black"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
exclude = ["build", "venv", ".venv", "node_modules"]

[tool.bandit.assert_used]
# B101 (use of assert) is desired in tests - pytest relies on plain assert
# statements, and none of them survive python -O the way production code would
# need to. Only skip it for test files; assert in koan/ itself should still be
# flagged (see koan/app.py's virt-module asserts).
skips = ["*_test.py", "*test_*.py", "*conftest.py"]
