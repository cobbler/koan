[build-system]
requires = ["setuptools", "setuptools_scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "koan"
description = "Kickstart over a Network Client for Cobbler"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [{name = "Team Cobbler", email = "cobbler.project@gmail.com"}]
license = {text = "GPL-2.0-only"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Systems Administration",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
]
dynamic = ["version"]
dependencies = ["distro", "libvirt-python", "netifaces"]

[project.urls]
Homepage = "https://www.github.com/cobbler/koan"

[project.scripts]
koan = "koan.cli:main"
cobbler-register = "koan.cli:register_main"

[project.optional-dependencies]
build = ["wheel"]
lint = ["pyflakes", "black", "isort", "types-netifaces"]
test = ["pytest", "pytest-cov", "pytest-mock"]
docs = ["Sphinx", "sphinx-rtd-theme"]

[tool.setuptools]
packages = ["koan", "koan.virt"]

[tool.setuptools_scm]
# Non-code configuration stays here
fallback_version = "3.0.2"
version_file = "koan/_version.py"
version_file_template = """# Auto-generated by setuptools_scm — do not edit
__version__ = "{version}"
__gitstamp__ = "{scm_version.node}"
__gitdate__ = "{scm_version.node_date}"
__builddate__ = "{scm_version.time}"
"""

[tool.isort]
profile = "black"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
exclude = ["build", "venv", ".venv", "node_modules"]

[tool.bandit.assert_used]
# B101 (use of assert) is desired in tests - pytest relies on plain assert
# statements, and none of them survive python -O the way production code would
# need to. Only skip it for test files; assert in koan/ itself should still be
# flagged (see koan/app.py's virt-module asserts).
skips = ["*_test.py", "*test_*.py", "*conftest.py"]
