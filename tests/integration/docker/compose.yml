# tests/integration/docker/compose.yml
#
# Self-contained Cobbler stack for koan's live-server integration suite. Vendored here
# instead of checked out from the cobbler/cobbler repo at CI time, so this suite doesn't
# depend on being able to clone Cobbler's source to get its compose topology. Modeled on
# Cobbler's own compose.yml + docker/compose/{base,tftp}.yml (traefik + cobblerd +
# http-api + cobbler-tftp) - keep this file in sync with those by hand if Cobbler's
# reference topology changes.
#
# Quick start:
#   docker compose -f tests/integration/docker/compose.yml up -d
#   curl http://localhost/cobbler_api        # -> routed to cobblerd's XMLRPC server

networks:
  cobbler:
    driver: bridge

volumes:
  cobbler-etc:
  cobbler-var-lib:
  cobbler-webdir:
  cobbler-tftproot:

configs:
  cobbler-settings:
    file: ./settings.yaml

services:
  traefik:
    image: traefik:v3.6
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    networks:
      - cobbler
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - label:disable
    restart: unless-stopped

  cobblerd:
    image: ghcr.io/cobbler/cobblerd:latest
    command: ["cobblerd", "-F"]
    environment:
      COBBLER_XMLRPC_BIND_ADDRESS: "0.0.0.0"
    configs:
      - source: cobbler-settings
        target: /etc/cobbler/settings.yaml
        mode: 0640
    volumes:
      - cobbler-etc:/etc/cobbler:z
      - cobbler-var-lib:/var/lib/cobbler:z
      - cobbler-webdir:/srv/www/cobbler:z
      - cobbler-tftproot:/srv/tftpboot:z
    networks:
      - cobbler
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cobbler-api.rule=PathPrefix(`/cobbler_api`)"
      - "traefik.http.routers.cobbler-api.entrypoints=web"
      - "traefik.http.services.cobbler-api.loadbalancer.server.port=25151"
      - "traefik.http.middlewares.cobbler-api-strip.stripprefix.prefixes=/cobbler_api"
      - "traefik.http.routers.cobbler-api.middlewares=cobbler-api-strip"
    restart: unless-stopped

  http-api:
    image: ghcr.io/cobbler/cobblerd:latest
    command: ["gunicorn", "cobbler.services:application", "--bind", "0.0.0.0:8000"]
    environment:
      COBBLER_XMLRPC_HOST: "cobblerd"
    configs:
      - source: cobbler-settings
        target: /etc/cobbler/settings.yaml
        mode: 0440
    volumes:
      - cobbler-webdir:/srv/www/cobbler:ro,z
      - cobbler-tftproot:/srv/tftpboot:ro,z
    networks:
      - cobbler
    depends_on:
      cobblerd:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cobbler-http-api.rule=PathPrefix(`/cblr`) || PathPrefix(`/httpboot`) || PathPrefix(`/images`)"
      - "traefik.http.routers.cobbler-http-api.entrypoints=web"
      - "traefik.http.services.cobbler-http-api.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.cobbler-svc-strip.stripprefix.prefixes=/cblr/svc"
      - "traefik.http.routers.cobbler-http-api.middlewares=cobbler-svc-strip"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  cobbler-tftp:
    image: ghcr.io/cobbler/cobbler-tftp:latest
    environment:
      COBBLER_XMLRPC_HOST: "cobblerd"
    ports:
      - "69:69/udp"
    networks:
      - cobbler
    depends_on:
      cobblerd:
        condition: service_healthy
    restart: unless-stopped
